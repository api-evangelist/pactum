aid: pactum
name: Pactum
description: >-
  Pactum is an AI procurement negotiation platform that deploys autonomous
  agents to conduct commercial supplier negotiations at scale while enforcing
  buyer-defined policies and guardrails. Its agent suite spans requisition
  alignment and negotiation, tactical and post-sourcing sourcing, price-list,
  discount, payment-terms, and rebate negotiations, letting enterprise
  procurement teams reach agreements on long-tail spend that would otherwise go
  unnegotiated. Pactum is a venture-backed enterprise SaaS company; as of this
  profile it exposes no public developer API, so this record captures the
  company's identity plus its published security, trust, and disclosure surface.
